<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#0057B8" />
    <title>BusTech Engineering · Inspection Suite</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="bustech-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="bustech-logo.png" />
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg);
            padding: 20px;
            font-family: 'Inter', sans-serif;
            text-align: center;
            margin: 0;
        }
        .launcher-brand {
            margin-bottom: 40px;
            width: 100%;
            max-width: 600px;
        }
        .launcher-logo {
            height: 70px;
            margin-bottom: 16px;
            mix-blend-mode: multiply;
        }
        body[data-theme="dark"] .launcher-logo {
            mix-blend-mode: normal;
            background-color: white;
            padding: 8px 16px;
            border-radius: var(--radius-md);
        }
        .launcher-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .launcher-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .portal-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        @media (min-width: 600px) {
            .portal-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .portal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .portal-card:hover, .portal-card:active {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .portal-icon {
            font-size: 3rem;
            color: var(--primary);
            background: var(--info-bg);
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 8px;
        }
        .portal-title {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .portal-desc {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }
    </style>
</head>
<body data-theme="light">
    
    <div class="launcher-brand">
        <img src="bustech-logo.png" alt="BusTech Logo" class="launcher-logo" />
        <div class="launcher-title">Inspection Suite</div>
        <div class="launcher-subtitle">Select Inspection Module</div>
    </div>

    <div class="portal-grid">
        <a href="static-pdi/" class="portal-card">
            <div class="portal-icon">
                <i class="fas fa-clipboard-check"></i>
            </div>
            <div class="portal-title">Static PDI</div>
            <div class="portal-desc">Workshop Level-2 Pre-Delivery</div>
        </a>
        
        <a href="road-test/" class="portal-card">
            <div class="portal-icon">
                <i class="fas fa-road"></i>
            </div>
            <div class="portal-title">Dynamic Road Test</div>
            <div class="portal-desc">Track & Highway Certification</div>
        </a>
    </div>

    <script>
        const storedTheme = localStorage.getItem('pdi-theme');
        if (storedTheme === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
